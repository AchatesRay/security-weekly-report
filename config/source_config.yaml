  language: en
  enabled: true
  scraper_config:
    article_selector: "a[href^='/blog/'].group"
    title_selector: "h2"
    summary_selector: "p.psmall"
    date_selector: "p.psmall"
    link_selector: ""
    link_base: "https://zeropath.com"

