  language: en
  source_level: S
  region: global
  enabled: true

- name: Semantic Scholar
  group: 学术论文
  url: https://api.semanticscholar.org/graph/v1/paper/search?query=cybersecurity&limit=50&fields=title,url,abstract,publicationDate,authors
  type: api
  api_platform: semantic_scholar
